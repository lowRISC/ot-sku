# This release test workflow is not meant to be run directly on the ot-sku repository
# since it creates testing branches and releases. Instead, test-release-ci.yml triggers
# a cross-ci run on lowRISC/ot-sku-testing which will replicate the content of the ot-sku
# repository and then run this workflow on ot-sku-testing.
name: Test release workflow
on:
  workflow_dispatch:
    inputs:
      testing_branch:
        description: Name of the testing branch to run the flow on
        type: string

jobs:
  e2e_release_test:
    name: Test release workflow
    runs-on: ubuntu-24.04
    permissions:
      # Used to trigger the test release flow.
      actions: write
      # Use to push to the pre-sign branch to add signatures.
      contents: write
    steps:
      - name: Setup
        id: setup
        env:
          TESTING_BRANCH: ${{ inputs.testing_branch }}
        run: |
          # Compute parameters for the presign
          echo "presign_release_tag=PRESIGN_RELEASE_$(echo "$TESTING_BRANCH" | awk '{print toupper($0)}')" >> $GITHUB_OUTPUT
          echo "presign_branch=presign_branch_$TESTING_BRANCH" >> $GITHUB_OUTPUT
          echo "postsign_release_tag=FINAL_RELEASE_$(echo "$TESTING_BRANCH" | awk '{print toupper($0)}')" >> $GITHUB_OUTPUT
          echo "postsign_branch=postsign_branch_$TESTING_BRANCH" >> $GITHUB_OUTPUT

      # We need the patched version of softHSM2 but it is not currently included in the devbundle.
      # The only alternative is therefore to rebuild it by checking out a copy of opentitan.
      - name: Checkout (opentitan)
        uses: actions/checkout@v6
        with:
          repository: lowRISC/opentitan
          ref: earlgrey_1.0.0
          fetch-depth: 0 # Bitstream cache requires all commits.
          path: opentitan

      - name: Build softhsm2
        id: softhsm2
        run: |
          cd opentitan
          ./bazelisk.sh build @softhsm2//:gen_dir
          SOFTHSM2=$(./bazelisk.sh cquery @softhsm2//:gen_dir | xargs realpath)
          echo "libsofthsm2=$SOFTHSM2/lib/softhsm/libsofthsm2.so" >> $GITHUB_OUTPUT

      - name: Run pre-sign
        id: presign
        env:
          # We need a token with sufficient privilege to trigger a workflow dispatch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTING_BRANCH: ${{ inputs.testing_branch }}
          RELEASE_TAG: ${{ steps.setup.outputs.presign_release_tag }}
          CREATE_BRANCH: ${{ steps.setup.outputs.presign_branch }}
        run: |
          set -e
          echo "workflow_info<<EOF" >> $GITHUB_OUTPUT
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/actions/workflows/pre-sign-release.yml/dispatches" \
            -f "ref=refs/heads/$TESTING_BRANCH" \
            -f "inputs[release_tag]=$RELEASE_TAG" \
            -f "inputs[create_branch]=$CREATE_BRANCH" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display pre-sign workflow link
        env:
          PRESIGN_WORKFLOW_URL: ${{ fromJSON(steps.presign.outputs.workflow_info).html_url }}
        run: |
          echo "Pre-sign release workflow: $PRESIGN_WORKFLOW_URL" >> $GITHUB_STEP_SUMMARY

      - name: Wait for pre-sign to finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRESIGN_WORKFLOW_RUNID: ${{ fromJSON(steps.presign.outputs.workflow_info).workflow_run_id }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Sometimes, despite the REST API returning a URL and a run ID, immediately asking Github about
          # the status of the run will fail with a 500 error. Experimentally, wait for a bit before asking
          # solves the problem.
          sleep 5
          gh run watch -R "$GITHUB_REPO" --exit-status --compact "$PRESIGN_WORKFLOW_RUNID"

      - name: Check pre-sign release
        id: presign-release
        env:
          PRESIGN_RELEASE_TAG: ${{ steps.setup.outputs.presign_release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -e
          echo "release_info<<EOF" >> $GITHUB_OUTPUT
          gh release view -R "$GITHUB_REPO" "$PRESIGN_RELEASE_TAG" --json url,assets | tee -a $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # Download the pre-sign artifacts.
          gh release download -R "$GITHUB_REPO" "$PRESIGN_RELEASE_TAG"
          # And extract them.
          mkdir presign_perso
          tar -xf presign_perso.tar.xz -C presign_perso
          mkdir presign_rom_ext
          tar -xf presign_rom_ext.tar.xz -C presign_rom_ext

      - name: Display pre-sign release link
        env:
          PRESIGN_BRANCH: ${{ steps.setup.outputs.presign_branch }}
          PRESIGN_RELEASE_URL: ${{ fromJSON(steps.presign-release.outputs.release_info).url }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "Pre-sign release: $PRESIGN_RELEASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "Pre-sign branch: https://github.com/$GITHUB_REPO/tree/$PRESIGN_BRANCH" >> $GITHUB_STEP_SUMMARY

      # We need hsmtool to be able to sign. Since we are testing against the earlgrey_1.0.0 branch, we may
      # as well download its devbundle to avoid rebuilding it.
      - name: Download OpenTitan devbundle
        env:
          DEVBUNDLE_RELEASE: devbundle-2026-10-21-1
        run: |
          set -e
          gh release download -R lowRISC/opentitan "$DEVBUNDLE_RELEASE" -O devbundle.tar.xz
          mkdir devbundle
          tar -xf devbundle.tar.xz -C devbundle

      - name: Checkout ot-sku pre-sign branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.setup.outputs.presign_branch }}
          path: ot-sku

      # Currently, the fake private keys used for signing are stored in an softHSM database in the ot-sku repository.
      - name: Sign artifacts
        env:
          HSMTOOL_MODULE: ${{ steps.softhsm2.outputs.libsofthsm2 }}
          OT_SKU: ot00
        run: |
          export HSMTOOL="$PWD/devbundle/hsmtool/hsmtool"
          export OT_SKU_PATH="$PWD/ot-sku"

          # Setup softHSM
          pushd ot-sku
          # See skus/open/fake_keygen/README.md
          touch skus/open/fake_keygen/softhsm2.conf
          source skus/open/fake_keygen/softhsm_sourceme.sh
          popd

          # Sign the artifacts
          pushd presign_perso
          $HSMTOOL exec provisioning_${OT_SKU}.json
          popd
          pushd presign_rom_ext
          $HSMTOOL exec rom_ext.json
          popd

          # Copy the signatures to the repository.
          cp presign_perso/*_sig "$OT_SKU_PATH/skus/open/signatures/perso/"
          cp presign_rom_ext/*_sig "$OT_SKU_PATH/skus/open/signatures/rom_ext/"

      - name: Push artifacts to the branch
        run: |
          cd ot-sku
          # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Prepare the signing artifacts. First, stage the signature files.
          # These are protected by `.gitignore` to avoid unintentionally committing signatures, so you must manually add them with `--force`.
          # Make sure you check that the files staged for commit are correct!
          git add --force skus/open/signatures/*
          # Commit the signing artifacts
          git commit -vs -m "Add signatures"
          # Push change to the branch
          git push

      - name: Run post-sign
        id: postsign
        env:
          # We need a token with sufficient privilege to trigger a workflow dispatch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Run it on the pre-sign branch. Usually, one would want to take the pre-sign branch, merge it back into
          # main and run the post-sign from there. However, this is inconvenient for a testing flow so we just run it
          # directly from the presign branch.
          TESTING_BRANCH: ${{ steps.setup.outputs.presign_branch }}
          PRESIGN_RELEASE_TAG: ${{ steps.setup.outputs.presign_release_tag }}
          RELEASE_TAG: ${{ steps.setup.outputs.postsign_release_tag }}
          CREATE_BRANCH: ${{ steps.setup.outputs.postsign_branch }}
        run: |
          set -e
          echo "workflow_info<<EOF" >> $GITHUB_OUTPUT
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/actions/workflows/post-sign-release.yml/dispatches" \
            -f "ref=refs/heads/$TESTING_BRANCH" \
            -f "inputs[presign_release_tag]=$PRESIGN_RELEASE_TAG" \
            -f "inputs[release_tag]=$RELEASE_TAG" \
            -f "inputs[create_branch]=$CREATE_BRANCH" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display post-sign workflow link
        env:
          PRESIGN_WORKFLOW_URL: ${{ fromJSON(steps.postsign.outputs.workflow_info).html_url }}
        run: |
          echo "Post-sign release workflow: $PRESIGN_WORKFLOW_URL" >> $GITHUB_STEP_SUMMARY

      - name: Wait for post-sign to finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTSIGN_WORKFLOW_RUNID: ${{ fromJSON(steps.postsign.outputs.workflow_info).workflow_run_id }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Sometimes, despite the REST API returning a URL and a run ID, immediately asking Github about
          # the status of the run will fail with a 500 error. Experimentally, wait for a bit before asking
          # solves the problem.
          sleep 5
          gh run watch -R "$GITHUB_REPO" --exit-status --compact "$POSTSIGN_WORKFLOW_RUNID"

      - name: Check post-sign release
        id: postsign-release
        env:
          POSTSIGN_RELEASE_TAG: ${{ steps.setup.outputs.postsign_release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -e
          echo "release_info<<EOF" >> $GITHUB_OUTPUT
          gh release view -R "$GITHUB_REPO" "$POSTSIGN_RELEASE_TAG" --json url,assets >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display post-sign release link
        env:
          POSTSIGN_RELEASE_URL: ${{ fromJSON(steps.postsign-release.outputs.release_info).url }}
        run: |
          echo "Post-sign release: $POSTSIGN_RELEASE_URL" >> $GITHUB_STEP_SUMMARY
